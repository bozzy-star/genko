<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>元寇</title>
<!-- itch.io 用: ゲーム画面と操作ボタンのみ。説明は itch のページ側に書く -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Shippori+Mincho+B1:wght@800&display=swap" rel="stylesheet">
<style>
/* Layout: 一枚の画面(ブラウン管風)を左、遊び方と敵の図鑑を右に置く二段組。狭い幅では縦積み。 */
:root{
  --ink:#14110f; --panel:#1e1915; --line:#3b3229; --paper:#efe4cc; --dim:#b3a78f;
  --vermilion:#e0553b; --gold:#e8b83a; --indigo:#7f98e8;
  --f-disp:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-pix:'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic','MS Gothic',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--paper);font:16px/1.7 var(--f-pix);margin:0;padding:8px}
.wrap{max-width:1024px;margin:0 auto;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
header{min-width:0}
h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(36px,8vw,60px);letter-spacing:.1em;line-height:1.1;margin:0;text-wrap:balance}
.lede{margin:8px 0 0;color:var(--dim);max-width:36em}
.game{display:grid;gap:12px;min-width:0;align-content:start}
.screen{background:#000;border:3px solid var(--line);line-height:0}
canvas#game{display:block;width:100%;aspect-ratio:512/480; /* 実際の比率はJSが設定 */image-rendering:pixelated;touch-action:none;outline:none}
canvas#game:focus-visible{box-shadow:0 0 0 3px var(--gold)}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;color:var(--paper);background:var(--panel);border:1px solid var(--line);padding:4px 14px;cursor:pointer}
.btn:hover{border-color:var(--dim)}
label.btn{display:inline-flex;align-items:center;gap:6px}
label.btn select{font:inherit;font-size:14px;color:var(--paper);background:var(--ink);border:1px solid var(--line);padding:2px 4px}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pad{display:none;justify-content:space-between;align-items:center;padding:4px 8px;user-select:none;-webkit-user-select:none;touch-action:none}
@media (pointer:coarse){.pad{display:flex}}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);grid-template-areas:". u ." "l . r" ". d ."}
.pad button{font:inherit;font-size:20px;color:var(--paper);background:var(--panel);border:1px solid var(--line);touch-action:none;-webkit-tap-highlight-color:transparent}
.pad button:active{background:#33291f}
.dpad .u{grid-area:u}.dpad .l{grid-area:l}.dpad .r{grid-area:r}.dpad .d{grid-area:d}
.pad .swap{width:56px;height:56px;border-radius:50%;font-size:18px}
.pad .fire{width:88px;height:88px;border-radius:50%;font-size:28px;background:#5a1f16;border-color:var(--vermilion)}
/* スマホ: 画面に半透明の操作を重ねる。左半分が仮想スティック、右下に「射」「替」 */
.screen{position:relative}
.touch{display:none}
.rotate{display:none;margin:0;font-size:14px;color:var(--dim)}
@media (pointer:coarse){
  .touch{display:block;position:absolute;inset:0;pointer-events:none}
  .zone{position:absolute;left:0;top:0;width:58%;height:100%;pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .touch,.touch *{-webkit-touch-callout:none}
  .stick{position:absolute;display:none;width:104px;height:104px;margin:-52px 0 0 -52px;border:2px solid rgba(239,228,204,.55);border-radius:50%;background:rgba(20,17,15,.28);pointer-events:none}
  .stick.on{display:block}
  .knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(239,228,204,.7);box-shadow:0 0 0 2px rgba(20,17,15,.4)}
  .tbtns{position:absolute;right:10px;bottom:10px;display:flex;align-items:flex-end;gap:12px}
  .tops{position:absolute;right:8px;top:8px;display:flex;gap:8px}
  .tfull,.tpause{width:auto;height:34px;padding:0 12px;border-radius:17px;font-size:14px}
  /* 全画面モード: 画面を端末いっぱいに固定し、ほかを隠す */
  body.play{overflow:hidden}
  body.play .screen{position:fixed;inset:0;z-index:50;height:100dvh;width:100vw;display:grid;place-items:center;background:#000;border:0}
  body.play header,body.play .bar,body.play .help,body.play .rotate{display:none}
  @media (orientation:landscape){body.play canvas#game{height:100dvh;width:auto;max-width:100vw}}
  @media (orientation:portrait){body.play canvas#game{width:100vw;height:auto;max-height:100dvh}}
  .tb{pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font:inherit;color:var(--paper);border-radius:50%;border:2px solid rgba(239,228,204,.6);background:rgba(20,17,15,.35)}
  .tswap{width:56px;height:56px;font-size:18px;margin-bottom:6px}
  .tfire{width:96px;height:96px;font-size:30px;background:rgba(90,31,22,.6);border-color:var(--vermilion)}
  .tb:active{background:rgba(239,228,204,.35)}
  .rotate{display:block}
  @media (orientation:landscape){
    body{padding:0}
    .wrap{gap:12px}
    header,.rotate{display:none}
    .screen{height:100svh;display:grid;place-items:center;background:#000;border:0}
    canvas#game{height:100svh;width:auto;max-width:100%}
    .bar{padding:0 12px}
  }
  .rotate{display:block}
}
.help{min-width:0;display:grid;gap:18px;align-content:start}
.help h2{font-family:var(--f-disp);font-weight:800;font-size:20px;letter-spacing:.08em;margin:0 0 6px;color:var(--gold)}
.help p,.help li{margin:0;color:var(--paper)}
.help ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
.keys dt{color:var(--dim)}.keys dd{margin:0}
.foes{display:grid;gap:8px}
.foe{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.foe canvas{width:64px;height:64px;image-rendering:pixelated;background:#7b6a45}
.foe b{display:block;font-weight:400;color:var(--gold)}
.foe span{font-size:14px;color:var(--dim);line-height:1.5}
.note{font-size:14px;color:var(--dim);line-height:1.6}
/* 画面は横1024px(論理256pxの4倍)まで広がり、説明はその下に二段組で並ぶ */
@media (min-width:860px){
  .help{grid-template-columns:1fr 1fr;gap:18px 36px;align-items:start}
  .help>.note{grid-column:1/-1}
}
.screen:fullscreen{display:grid;place-items:center;border:0;background:#000}
.screen:fullscreen canvas#game{width:auto;height:100vh;max-width:100vw;aspect-ratio:512/480}
</style>
</head>
<body>

<main class="wrap">

  <section class="game" aria-label="ゲーム画面">
    <div class="screen" id="screen">
      <canvas id="game" width="1024" height="960" tabindex="0" aria-label="元寇のゲーム画面"></canvas>
      <div class="touch" aria-hidden="true">
        <div class="zone" id="zone"><div class="stick" id="stick"><div class="knob" id="knob"></div></div></div>
        <div class="tops">
          <button type="button" class="tb tfull" id="btnPlay" aria-label="全画面で遊ぶ">全画面</button>
          <button type="button" class="tb tpause" id="btnPause2" aria-label="一時停止">II</button>
        </div>
        <div class="tbtns">
          <button type="button" data-k="swap" class="tb tswap" aria-label="武器を持ち替える">替</button>
          <button type="button" data-k="fire" class="tb tfire" aria-label="攻撃">射</button>
        </div>
      </div>
    </div>
    <p class="rotate">スマホは、画面右上の「全画面」を押してから横向きにすると大きく遊べます。左半分をなぞって移動、右下の「射」で攻撃。画面は自動で「スマホ 16×15マス」になります(下の「画面」で切替可)。</p>
    <div class="bar">
      <button class="btn" id="btnPause" type="button">一時停止 (P)</button>
      <button class="btn" id="btnSound" type="button" aria-label="音量">音量 ■■■■ (M)</button>
      <button class="btn" id="btnFull" type="button">全画面 (F)</button>
      <label class="btn" for="selView">画面
        <select id="selView" aria-label="画面の広さ">
          <option value="0">PC 32×30マス</option><option value="1">スマホ 16×15マス(大きいドット)</option>
        </select>
      </label>
    </div>
  </section>

</main>

<script>
(()=>{
'use strict';
let W=512,H=480,COLS=32; /* 画面: PCは32×30マス、スマホは16×15マス(ドットが2倍の大きさ) */
const T=16,SW=256,SH=240; /* タイトル等の場面絵は256×240で描き、画面幅に合わせて拡大 */
const WIDE=()=>W>256;
const cv=document.getElementById('game');
const main=cv.getContext('2d');
/* 難易度: normal(3)がこれまでの調整。敵の速さ・出現間隔・射撃間隔・大将の体力・守り・夜の発見距離・得点倍率が変わる */
const DIFFS=[
  {name:'baby',  lives:3,life:5,spd:.8, spawn:1.6,shot:1.5,hp:.6, guard:7,see:48,inv:240,mult:.5},
  {name:'easy',  lives:3,life:4,spd:.9, spawn:1.25,shot:1.2,hp:.8,guard:6,see:56,inv:190,mult:.75},
  {name:'normal',lives:3,life:3,spd:1,  spawn:1,  shot:1,  hp:1,  guard:5,see:64,inv:150,mult:1},
  {name:'hard',  lives:3,life:2,spd:1.12,spawn:.8,shot:.8, hp:1.3,guard:4,see:74,inv:120,mult:1.25},
  {name:'expert',lives:3,life:1,spd:1.25,spawn:.65,shot:.65,hp:1.6,guard:3,see:86,inv:100,mult:1.5}
];
let diff=2;
const D=()=>DIFFS[diff];
try{const d=localStorage.getItem('genko-diff');if(d!==null&&DIFFS[+d])diff=+d;}catch(e){}
let pendingView=null;
function setView(narrow){
  W=narrow?256:512;H=narrow?240:480;COLS=narrow?16:32;
  cv.width=W*2;cv.height=H*2;cv.style.aspectRatio=W+'/'+H;
  const sel=document.getElementById('selView');if(sel)sel.value=narrow?'1':'0';
  try{localStorage.setItem('genko-view',narrow?'1':'0');}catch(e){}
}
{
  let pref=null;try{pref=localStorage.getItem('genko-view');}catch(e){}
  const coarse=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||(typeof innerWidth==='number'&&innerWidth<700);
  setView(pref===null?coarse:pref==='1');
}
let g=main;
const FONT="'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic','MS Gothic',monospace";
const K='#1a1410',PAPER='#efe4cc',RED='#d6402a',GOLD='#e8b83a',INDIGO='#2f4a9a';

/* ---------- drawing helpers ---------- */
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h);};
function text(s,x,y,size,col,align){g.font=size+'px '+FONT;g.textAlign=align||'left';g.textBaseline='top';g.fillStyle=col;g.fillText(s,x,y);}
function otext(s,x,y,size,col,out,align){
  for(const d of [[-1,0],[1,0],[0,-1],[0,1],[1,1],[-1,1]]) text(s,x+d[0],y+d[1],size,out,align);
  text(s,x,y,size,col,align);
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(a,b){let h=(Math.imul(a,73856093)^Math.imul(b,19349663))>>>0;h^=h>>>13;h=Math.imul(h,0x5bd1e995)>>>0;return h^(h>>>15);}

/* ---------- input ---------- */
const inp={up:0,down:0,left:0,right:0,fire:0,swap:0};
const kb={},tc={};
let lastDir=null; /* 最後に押した方向。向きはこれを優先する */
const DIRK={up:'u',down:'d',left:'l',right:'r'};
function recalc(){for(const k in inp)inp[k]=(kb[k]||tc[k])?1:0;}
const KMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',KeyZ:'fire',Space:'fire',KeyJ:'fire',KeyX:'swap',ShiftLeft:'swap',ShiftRight:'swap'};
addEventListener('keydown',e=>{
  const a=KMAP[e.code];
  if(a){if(DIRK[a]&&!kb[a])lastDir=a;kb[a]=1;recalc();e.preventDefault();initAudio();}
  if(e.code==='Enter'){pressStart();e.preventDefault();}
  if(mode==='title'&&/^Digit[1-6]$/.test(e.code)){startAt=+e.code.slice(5)-1;if(selStage)selStage.value=String(startAt);pressStart();e.preventDefault();}
  if(!e.repeat&&(e.code==='KeyP'||e.code==='Escape'))setPause(!paused);
  if(!e.repeat&&e.code==='KeyM')cycleVol();
  if(!e.repeat&&e.code==='KeyF')toggleFull();
});
addEventListener('keyup',e=>{const a=KMAP[e.code];if(a){kb[a]=0;recalc();e.preventDefault();}});
addEventListener('blur',()=>{for(const k in kb)kb[k]=0;releaseAllTouch();if(mode==='play')setPause(true);});
document.addEventListener('visibilitychange',()=>{if(document.hidden){releaseAllTouch();if(mode==='play')setPause(true);}});
/* タッチボタン: 押している指のIDを覚え、離した・取り消された・ページから外れた、どの場合でも必ず離す */
const tcIds={};
function releaseAllTouch(){for(const k in tc)tc[k]=0;for(const k in tcIds)tcIds[k]=null;recalc();}
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();tcIds[k]=e.pointerId;tc[k]=1;recalc();initAudio();try{b.setPointerCapture(e.pointerId);}catch(err){}});
  const rel=e=>{if(tcIds[k]===null||tcIds[k]===undefined||e.pointerId===tcIds[k]){tc[k]=0;tcIds[k]=null;recalc();}};
  for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,rel);
  b.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')rel(e);});
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
addEventListener('pointerup',e=>{for(const k in tcIds)if(tcIds[k]===e.pointerId){tc[k]=0;tcIds[k]=null;recalc();}});
addEventListener('pointercancel',e=>{for(const k in tcIds)if(tcIds[k]===e.pointerId){tc[k]=0;tcIds[k]=null;recalc();}});
cv.addEventListener('pointerdown',()=>{cv.focus();initAudio();pressStart();});
/* 仮想スティック: 左側のどこを触っても、その点を中心に指の向きへ動く(8方向) */
(()=>{
  const zone=document.getElementById('zone'),stick=document.getElementById('stick'),knob=document.getElementById('knob');
  if(!zone||!stick||!knob)return;
  let id=null,ox=0,oy=0,lastT=0;
  const setDir=(dx,dy)=>{
    const d=Math.hypot(dx,dy);
    tc.up=tc.down=tc.left=tc.right=0;
    if(d>10){
      const a=Math.atan2(dy,dx),c=Math.cos(a),s=Math.sin(a);
      if(c>.38)tc.right=1;if(c<-.38)tc.left=1;
      if(s>.38)tc.down=1;if(s<-.38)tc.up=1;
      lastDir=Math.abs(c)>=Math.abs(s)?(c>0?'right':'left'):(s>0?'down':'up');
    }
    recalc();
    const k=Math.min(d,40),a2=Math.atan2(dy,dx);
    knob.style.transform=d>0?'translate('+(Math.cos(a2)*k)+'px,'+(Math.sin(a2)*k)+'px)':'';
  };
  const stop=()=>{id=null;stick.classList.remove('on');setDir(0,0);};
  zone.addEventListener('pointerdown',e=>{
    /* 前の指の離し損ね(1.5秒以上動きなし)は捨てて、新しい指を受け付ける */
    if(id!==null&&e.pointerId!==id&&performance.now()-lastT<1500)return;
    id=e.pointerId;lastT=performance.now();
    try{zone.setPointerCapture(id);}catch(err){}
    const rc=zone.getBoundingClientRect();ox=e.clientX-rc.left;oy=e.clientY-rc.top;
    stick.style.left=ox+'px';stick.style.top=oy+'px';stick.classList.add('on');
    setDir(0,0);initAudio();if(mode!=='title')pressStart();e.preventDefault();
  });
  zone.addEventListener('pointermove',e=>{
    if(e.pointerId!==id)return;lastT=performance.now();
    const rc=zone.getBoundingClientRect();setDir(e.clientX-rc.left-ox,e.clientY-rc.top-oy);e.preventDefault();
  });
  const end=e=>{if(id===null||e.pointerId!==id)return;stop();};
  zone.addEventListener('pointerup',end);zone.addEventListener('pointercancel',end);zone.addEventListener('lostpointercapture',end);
  addEventListener('pointerup',end);addEventListener('pointercancel',end);
  addEventListener('blur',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
  zone.addEventListener('contextmenu',e=>e.preventDefault());
  /* 「射」ボタンを押したまま上へなぞると弓と薙刀を持ち替える */
  const fb=document.querySelector('.tfire');
  if(fb){
    let fid=null,fy=0,done=false;
    fb.addEventListener('pointerdown',e=>{fid=e.pointerId;fy=e.clientY;done=false;});
    fb.addEventListener('pointermove',e=>{if(e.pointerId!==fid||done)return;if(fy-e.clientY>26){done=true;swapPulse=2;}});
    const fe=e=>{if(e.pointerId===fid)fid=null;};
    fb.addEventListener('pointerup',fe);fb.addEventListener('pointercancel',fe);
  }
})();
document.getElementById('btnPause').addEventListener('click',()=>setPause(!paused));
document.getElementById('btnSound').addEventListener('click',()=>{initAudio();cycleVol();});
/* 全画面: 本物の全画面(Android等)を試し、効かない端末(iPhone)でも画面いっぱいに固定表示する */
function toggleFull(){
  const sc=document.querySelector('.screen'),on=!document.body.classList.contains('play');
  document.body.classList.toggle('play',on);
  const bp=document.getElementById('btnPlay');if(bp)bp.textContent=on?'戻る':'全画面';
  if(on){
    if(sc.requestFullscreen){sc.requestFullscreen().then(()=>{try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}
    else if(sc.webkitRequestFullscreen)sc.webkitRequestFullscreen();
    window.scrollTo(0,0);
  }else{
    if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});
    try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();}catch(e){}
  }
  cv.focus();
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement&&document.body.classList.contains('play')){
    document.body.classList.remove('play');const bp=document.getElementById('btnPlay');if(bp)bp.textContent='全画面';
  }
});
document.getElementById('btnFull').addEventListener('click',toggleFull);
{const bp=document.getElementById('btnPlay');if(bp)bp.addEventListener('click',e=>{e.preventDefault();initAudio();toggleFull();});
 const bp2=document.getElementById('btnPause2');if(bp2)bp2.addEventListener('click',e=>{e.preventDefault();setPause(!paused);});}

/* ---------- audio ---------- */
/* 音量: 5段階(0=無音, 4=最大=従来の音量)。Mキーか音量ボタンで 4→3→2→1→0→4 と巡る */
const VOLS=[0,.055,.1,.155,.22];
let vol=4;try{const v=localStorage.getItem('genko-vol');if(v!==null&&VOLS[+v]!==undefined)vol=+v;}catch(e){}
let AC=null,master=null,muted=vol===0,nt=0,bs=0;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=VOLS[vol];master.connect(AC.destination);
    nt=AC.currentTime+.1;
    setInterval(bgmTick,90);
  }catch(e){AC=null;}
}
function setVol(v){
  vol=Math.max(0,Math.min(4,v));muted=vol===0;
  if(master)master.gain.value=VOLS[vol];
  try{localStorage.setItem('genko-vol',String(vol));}catch(e){}
  document.getElementById('btnSound').textContent='音量 '+('■'.repeat(vol)+'□'.repeat(4-vol))+' (M)';
}
function cycleVol(){setVol(vol===0?4:vol-1);}
function setMute(v){setVol(v?0:4);}
setVol(vol);
function tone(f,d,type,slide,vol,delay){
  if(!AC||muted)return;
  const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),gn=AC.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  gn.gain.setValueAtTime(vol||.5,t);
  gn.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(gn);gn.connect(master);o.start(t);o.stop(t+d+.02);
}
function noise(d,vol,delay){
  if(!AC||muted)return;
  const n=(AC.sampleRate*d)|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),gn=AC.createGain();
  s.buffer=b;gn.gain.value=vol;s.connect(gn);gn.connect(master);s.start(AC.currentTime+(delay||0));
}

function vhiss(d,t0,vol,hz){

function tileAt(tx,ty){if(tx<0||tx>=COLS||ty<0||ty>=L.rows)return 1;return L.tiles[ty*COLS+tx];}
function rectBlocked(cx,cy,w,h,arrow){
  const x0=Math.floor((cx-w/2)/T),x1=Math.floor((cx+w/2-.01)/T),y0=Math.floor((cy-h/2)/T),y1=Math.floor((cy+h/2-.01)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const t=tileAt(tx,ty);
    if(t===0)continue;
    if(arrow&&t===2)continue;
    return true;
  }
  return false;
}
function moveBox(e,vx,vy,hb){
  let m=false;
  if(vx&&!rectBlocked(e.x+vx,e.y,hb,hb)){e.x+=vx;m=true;}
  if(vy&&!rectBlocked(e.x,e.y+vy,hb,hb)){e.y+=vy;m=true;}
  return m;
}
function walk(e,vx,vy,hb){
  const sp=Math.hypot(vx,vy);
  if(e.slide>0){e.slide--;vx=e.sx*sp;vy=e.sy*sp;}
  const mx=!!vx&&!rectBlocked(e.x+vx,e.y,hb,hb);if(mx)e.x+=vx;
  const my=!!vy&&!rectBlocked(e.x,e.y+vy,hb,hb);if(my)e.y+=vy;
  if(!mx&&!my&&sp>0&&e.slide<=0){
    e.slide=24;
    if(Math.abs(vx)>Math.abs(vy)){e.sx=0;e.sy=Math.random()<.5?-1:1;}else{e.sy=0;e.sx=Math.random()<.5?-1:1;}
  }
  return mx||my;
}

  const k=(dx&&dy)?.7071:1,rw=P.rowers,ms=1.4+.04*rw,kk=[.03,.07,.16,.4,1][rw],wd=(1-rw/4)*.018;
  P.vx+=(dx*k*ms-P.vx)*kk+GALE.x*wd;P.vy+=(dy*k*ms-P.vy)*kk+GALE.y*wd;
  const spd=Math.hypot(P.vx,P.vy),cap=ms+.6;
  if(spd>cap){P.vx*=cap/spd;P.vy*=cap/spd;}
  if(Math.abs(P.vx)<.005)P.vx=0;
  if(Math.abs(P.vy)<.005)P.vy=0;
  if(P.vx&&!rectBlocked(P.x+P.vx,P.y,10,10))P.x+=P.vx;else P.vx=0;
  if(P.vy&&!rectBlocked(P.x,P.y+P.vy,10,10))P.y+=P.vy;else P.vy=0;
  const sp=Math.hypot(P.vx,P.vy);
  P.anim+=sp*.12;
  if(sp>.5&&(tick%4)===0)L.parts.push({x:P.x-P.vx*5,y:P.y+5,vx:0,vy:0,life:18,c:'#bcd6e6',s:2});
}
function updPlayer(){
  const sea=L.S.theme==='sea';
  const dx=inp.right-inp.left,dy=inp.down-inp.up;
  if(sea)updBoat(dx,dy);
  if(dx||dy){
    const k=(dx&&dy)?.7071:1,sp=(P.horse?1.9:1.15)*k;
    if(P.stall<=0&&!sea){moveBox(P,dx*sp,dy*sp,10);P.anim+=P.horse?.2:.16;}
    const pd=[];if(dx)pd.push(dx>0?'r':'l');if(dy)pd.push(dy>0?'d':'u');
    if(lastDir&&inp[lastDir])P.dir=DIRK[lastDir];
    else if(!pd.includes(P.dir))P.dir=pd[pd.length-1];
  }
  if(P.stall>0)P.stall--;
  P.f=(P.anim|0)&1;
  if(P.inv>0)P.inv--;
  if(P.fcd>0)P.fcd--;
  const se=(inp.swap&&!psw)||swapPulse===2;psw=inp.swap;if(swapPulse>0)swapPulse--;
  if(se&&G.naginata&&P.sw<=0){P.weapon=P.weapon==='bow'?'naginata':'bow';toast(P.weapon==='bow'?'弓に持ち替えた':'薙刀に持ち替えた');sfx.horse();}
  if(P.sw>0)swingStep();
  else if(inp.fire&&P.fcd<=0){
    if(P.weapon==='naginata'){P.sw=14;P.side=-P.side;P.swHit=new Set();P.fcd=20;sfx.shot();}
    else if(L.arrows.length<(P.bowLv?P.bowLv*9:4))shoot();
  }
}
let psw=0,swapPulse=0;
/* 薙刀: 徒歩は右→前、左→前の二段。騎馬は片側だけ(一振りごとに左右が替わる) */
function swingAng(){
  const t=Math.min(13,14-P.sw);
  if(P.horse)return P.side*(Math.PI/2)*(1-t/13);
  return t<7?(Math.PI/2)*(1-t/6):-(Math.PI/2)*(1-(t-7)/6);
}
function swingStep(){
  const v=DV[P.dir],base=Math.atan2(v[1],v[0]),a=base+swingAng(),R0=24;
  P.sw--;
  const hit=(x,y)=>{const dx=x-P.x,dy=y-P.y,d=Math.hypot(dx,dy);if(d>R0||d<1)return false;let da=Math.atan2(dy,dx)-a;da=Math.atan2(Math.sin(da),Math.cos(da));return Math.abs(da)<.7;};
  L.swings.push({x:P.x,y:P.y,a:a,t:0});
  for(const e of L.enemies){
    if(e.dead||e.asleep||P.swHit.has(e))continue;
    const cy=e.t==='rider'?e.y-4:e.y;
    if(hit(e.x,cy)){P.swHit.add(e);if(e.sur)slaySur(e);else{if(e.shield>0){e.shield=0;burst(e.x,e.y,['#e8dcc0'],6,1.6);addScore(50);}kill(e,true,true);}}
  }
  for(const f of L.folk){if(!f.dead&&hit(f.x,f.y))killFolk(f,true);}
  for(const q of L.earrows){if(!q.dead&&hit(q.x,q.y)){q.dead=true;spark(q.x,q.y);}}
  const b=L.boss;
  if(b&&!b.dead&&!b.asleep&&!P.swHit.has(b)&&hit(b.x,b.y-2)){P.swHit.add(b);damageBoss(2);}
}
function shoot(){
  const v=DV[P.dir],sp=3.4,n=P.bowLv||0;
  const dirs=[[v[0],v[1]],[-v[0],-v[1]],[-v[1],v[0]],[v[1],-v[0]]];
  const use=n?dirs.slice(0,n):[dirs[0]],angs=n?[-.3,0,.3]:[0],life=n?48:94; /* 射程: 通常20マス、三矢10マス */
  for(const d of use)for(const a of angs){
    const c=Math.cos(a),s=Math.sin(a);
    L.arrows.push({x:P.x+d[0]*8,y:P.y+d[1]*8-2,vx:(d[0]*c-d[1]*s)*sp,vy:(d[0]*s+d[1]*c)*sp,life:life,wk:.8*sp/life,hm:P.homing>0});
  }
  P.fcd=n?15:12;sfx.shot();
}
function loseHorse(){
  P.horse=false;P.stall=0;P.inv=90;sfx.neigh();L.shake=8;

function hurt(){

  /* ライフ: 難易度ぶんの手傷に耐え、尽きると討死 */
  P.hp--;
  if(P.hp>0){P.inv=90;sfx.hurt();L.shake=8;burst(P.x,P.y,[RED,PAPER],10,1.8);toast('手傷! あと'+'♥'.repeat(P.hp));return;}
  fall();
}
function fall(){

function respawn(){
  P.inv=D().inv;P.bowLv=0;P.horse=false;P.stall=0;P.hp=D().life;P.homing=0;L.earrows=[];L.bombs=[];L.stamp=[];L.guard=D().guard;

    else if(r<.115)L.items.push({t:'wind',x:e.x,y:e.y,a:0});

function updArrows(){
  for(const a of L.arrows){
    if(a.hm){
      /* 追尾: いちばん近い敵(か大将)へ、毎フレーム少しずつ向きを曲げる */
      let tg=null,bd=140;
      for(const e of L.enemies){if(e.dead||e.asleep||e.sur)continue;const d=Math.hypot(e.x-a.x,e.y-a.y);if(d<bd){bd=d;tg=e;}}
      if(L.boss&&!L.boss.dead&&!L.boss.asleep){const d=Math.hypot(L.boss.x-a.x,L.boss.y-a.y);if(d<bd){bd=d;tg=L.boss;}}
      if(tg){
        const sp=Math.hypot(a.vx,a.vy),ca=Math.atan2(a.vy,a.vx),ta=Math.atan2(tg.y-a.y,tg.x-a.x);
        let da=Math.atan2(Math.sin(ta-ca),Math.cos(ta-ca));da=Math.max(-.14,Math.min(.14,da));
        a.vx=Math.cos(ca+da)*sp;a.vy=Math.sin(ca+da)*sp;
      }
    }
    if(a.wk){a.vx+=GALE.x*a.wk;a.vy+=GALE.y*a.wk;}
    a.x+=a.vx;a.y+=a.vy;a.life--;
    if(a.life<=0||rectBlocked(a.x,a.y,2,2,true)){
      if(a.life>0)spark(a.x,a.y);a.dead=true;
      if(L.S.theme==='night')for(const e of L.enemies){if(!e.dead&&!e.asleep&&e.alert<=0&&Math.abs(a.x-e.x)<18&&Math.abs(a.y-e.y)<18)spot(e);}
      continue;
    }
    for(const e of L.enemies){
      if(e.dead||e.asleep)continue;
      const rd=e.t==='rider',nt=L.S.theme==='night',cy=rd?e.y-4:e.y,hy=rd?11:(nt?11:8),hx=rd?11:(nt?11:8);
      if(Math.abs(a.x-e.x)<hx&&Math.abs(a.y-cy)<hy){
        a.dead=true;
        /* 夜討ち: 気づかれていない敵は盾があろうと一矢で倒れる */
        if(L.S.theme==='night'&&e.alert<=0&&!e.sur){e.shield=0;e.quiet=true;kill(e,true,true);break;}
        if(e.shield>0&&(a.vx*e.fx+a.vy*e.fy)<-.45*Math.hypot(a.vx,a.vy)){
          spark(a.x,a.y);e.wx=8;
          if(--e.shield<=0)breakShield(e);else sfx.bump();
          break;
        }
        if(e.sur)slaySur(e);else kill(e,true,true);
        break;
      }
    }
    if(!a.dead)for(const f of L.folk){if(!f.dead&&Math.abs(a.x-f.x)<7&&Math.abs(a.y-f.y)<7){a.dead=true;killFolk(f,true);break;}}
    const bs=L.boss;
    if(!a.dead&&bs&&!bs.dead&&!bs.asleep){
      const bx=bs.k==='marco'?11:15,by=bs.k==='marco'?13:17;
      if(Math.abs(a.x-bs.x)<bx&&Math.abs(a.y-(bs.y-2))<by){a.dead=true;damageBoss(1);}
    }
  }
  L.arrows=L.arrows.filter(a=>!a.dead);
}
function updEArrows(){
  for(const a of L.earrows){
    if(a.wk){a.vx+=GALE.x*a.wk;a.vy+=GALE.y*a.wk;}
    a.x+=a.vx;a.y+=a.vy;a.life--;
    if(a.life<=0||rectBlocked(a.x,a.y,2,2,true)){a.dead=true;continue;}
    if(P.inv<=0&&Math.abs(a.x-P.x)<6&&Math.abs(a.y-P.y)<6){a.dead=true;hurt();continue;}
    for(const b of L.arrows){
      if(!b.dead&&Math.abs(a.x-b.x)<5&&Math.abs(a.y-b.y)<5){a.dead=true;b.dead=true;spark(a.x,a.y);break;}
    }
  }

  L.arrows=L.arrows.filter(a=>!a.dead);
}

const ROWMSG=['漕ぎ手が加わった! 舟が曲がりやすい','漕ぎ手 二人! さらに軽く','漕ぎ手 三人! もう少し','漕ぎ手 四人! 思いのまま進む'];

/* ---------- enemies ---------- */
/* 夜討ち: 敵は御家人を見つけるまで松明を提げて巡回し、攻撃しない。見つけると「ここじゃー」と叫んで仲間を呼ぶ */
function spot(e,quiet){
  if(e.dead||e.sur)return;
  const fresh=e.alert<=0;
  e.alert=240;
  if(!fresh||quiet)return;
  e.sayT=60;
  if(L.cryT<=0){L.cryT=45;voice.koko();}
  for(const o of L.enemies){if(o!==e&&!o.dead&&!o.asleep&&Math.hypot(o.x-e.x,o.y-e.y)<130)spot(o,true);}
  /* 援軍: 画面の上端から一~二人 */
  const n=1+(Math.random()<.5?1:0);
  for(let i=0;i<n;i++)for(let k=0;k<8;k++){
    const x=T+Math.random()*(W-2*T),y=L.cam-10;
    if(y>20&&!rectBlocked(x,y,12,12)){const o=mkEnemy(wpick(L.S.mix,Math.random),x,y,false);o.alert=240;L.enemies.push(o);break;}
  }
}
function stepEnemy(e){
  if(e.asleep){if(e.y>L.cam-20&&e.y<L.cam+H+20)e.asleep=false;else return;}
  const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
  let ux=dx/d,uy=dy/d;
  if(e.sayT>0)e.sayT--;
  if(L.S.theme==='night'&&!e.sur){
    if(e.alert>0)e.alert--;
    const seen=d<D().see*(P.horse?1.45:1)&&e.y>L.cam-10&&e.y<L.cam+H+10;
    if(seen)spot(e);
    if(e.alert<=0){
      /* 巡回 */
      e.anim+=.08;e.f=(e.anim|0)&1;
      if(--e.pt<=0){e.pt=60+Math.random()*90;e.pa=Math.random()*6.283;}
      const vx=Math.cos(e.pa)*.3,vy=Math.sin(e.pa)*.3;
      if(!walk(e,vx,vy,10))e.pa+=Math.PI/2;
      e.face=Math.abs(vx)>Math.abs(vy)?(vx>0?'r':'l'):(vy>0?'d':'u');
      return;
    }
  }
  const vis=e.y>L.cam&&e.y<L.cam+H,def=L.S.kind==='defense';
  let mvx=0,mvy=0,hb=10;
  e.anim+=.12;e.f=(e.anim|0)&1;
  if(e.wx>0)e.wx--;
  /* 防衛戦: 足軽・高麗・宋は御家人が近くにいなければ町(画面下)をめざす */
  const march=def&&d>72&&(e.t==='foot'||e.t==='koryo'||e.t==='song');
  if(march){ux=Math.sin(tick/50+e.x)*.25;uy=1;const n=Math.hypot(ux,uy);ux/=n;uy/=n;}
  if(e.t==='foot'){
    const sp=.55+.05*Math.min(4,G.stage);mvx=ux*sp;mvy=uy*sp;
  }else if(e.t==='koryo'){
    const sp=.42;mvx=ux*sp;mvy=uy*sp;
    const tx=dx/d,ty=dy/d;e.fx+=(tx-e.fx)*.06;e.fy+=(ty-e.fy)*.06;
    const n=Math.hypot(e.fx,e.fy)||1;e.fx/=n;e.fy/=n;
  }else if(e.t==='song'){
    if(e.sur){e.f=0;e.face='d';}
    else{
      const sp=.36;mvx=ux*sp;mvy=uy*sp;
      const pv=DV[P.dir],facing=((e.x-P.x)*pv[0]+(e.y-P.y)*pv[1])>d*.6;
      if(d<56&&facing&&vis&&Math.random()<.03){e.sur=true;mvx=0;mvy=0;burst(e.x,e.y-8,['#ffffff',PAPER],8,1);if(!L.surMsg){L.surMsg=true;toast('宋兵が白旗をあげた! 触れて捕虜にせよ');}}
    }
  }else if(e.t==='archer'){
    const sp=.42;
    if(d>100){mvx=ux*sp;mvy=uy*sp;}else if(d<62){mvx=-ux*sp;mvy=-uy*sp;}
    if(--e.cd<=0&&vis&&d<112){e.cd=(100+Math.random()*55)*D().shot;const as=1.5*(.85+.15*D().spd);L.earrows.push({x:e.x,y:e.y,vx:ux*as,vy:uy*as,life:75,wk:.8*1.5/75});sfx.shot2();}
  }else if(e.t==='bomber'){
    const sp=.4;
    if(d>120){mvx=ux*sp;mvy=uy*sp;}else if(d<80){mvx=-ux*sp;mvy=-uy*sp;}
    if(--e.cd<=0&&vis&&d<210){e.cd=(150+Math.random()*60)*D().shot;L.bombs.push({sx:e.x,sy:e.y,tx:P.x,ty:P.y,t:0,dur:60});sfx.throw();}
  }else{
    hb=12;

function updEnemies(){
  for(const e of L.enemies){
    if(e.dead)continue;

      const r=P.horse?11:(e.t==='rider'?10:9);
      if(Math.abs(P.x-e.x)<r&&Math.abs(P.y-e.y)<r){
        if(e.sur)capture(e);
        else if(P.horse&&P.stall<=0&&e.t!=='rider'&&e.t!=='koryo'){kill(e,true,true);L.shake=Math.max(L.shake,3);}
        else{if(L.S.theme==='night')spot(e);if(P.inv<=0)hurt();}
      }
    }
    if(!e.asleep&&Math.abs(e.y-P.y)>H+140)e.dead=true;
    if(L.S.kind==='defense'&&!e.dead&&e.y>H-9){burst(e.x,H-4,[K,LOOK[e.t].body],6,1.2);e.dead=true;L.guard--;L.shake=Math.max(L.shake,6);toast('敵に抜かれた! 守り-1');sfx.hurt();if(L.guard<=0)breach();}
  }
  if(L.S.kind==='defense')updFolk();
  const en=L.enemies.filter(e=>!e.dead&&!e.asleep&&e.st!==2);
  for(let i=0;i<en.length;i++)for(let j=i+1;j<en.length;j++){
    const a=en[i],b=en[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
    if(d2<100&&d2>.01){const d=Math.sqrt(d2),px=dx/d*.35,py=dy/d*.35;moveBox(b,px,py,10);moveBox(a,-px,-py,10);}
  }
  L.enemies=L.enemies.filter(e=>!e.dead);
}
function updFolk(){
  for(const f of L.folk){
    if(f.dead)continue;
    f.anim+=.1;f.f=(f.anim|0)&1;
    let near=null,nd=56;
    for(const e of L.enemies){if(e.dead||e.asleep||e.sur)continue;const d=Math.hypot(e.x-f.x,e.y-f.y);if(d<nd){nd=d;near=e;}}
    if(near){
      f.panic=20;
      const dx=f.x-near.x,dy=f.y-near.y,d=Math.hypot(dx,dy)||1;
      f.vx=dx/d*.75;f.vy=dy/d*.75+.1;
      if(nd<9){killFolk(f,false);continue;}
    }else if(Math.hypot(P.x-f.x,P.y-f.y)<22){
      /* 御家人の足元には寄らない(薙刀の巻き添え防止) */
      const dx=f.x-P.x,dy=f.y-P.y,d=Math.hypot(dx,dy)||1;f.vx=dx/d*.5;f.vy=dy/d*.5;f.tt=10;
    }else if(--f.tt<=0){
      f.tt=40+Math.random()*80;
      if(Math.random()<.4){f.vx=0;f.vy=0;}else{const a=Math.random()*6.283;f.vx=Math.cos(a)*.4;f.vy=Math.sin(a)*.4;}
    }
    if(f.panic>0)f.panic--;
    if(f.vx||f.vy){
      walk(f,f.vx,f.vy,10);
      f.face=Math.abs(f.vx)>Math.abs(f.vy)?(f.vx>0?'r':'l'):(f.vy>0?'d':'u');
    }
    f.x=Math.max(10,Math.min(W-10,f.x));f.y=Math.max(H*.3,Math.min(H-10,f.y));
    if(P.horse&&P.stall<=0&&Math.abs(P.x-f.x)<10&&Math.abs(P.y-f.y)<10)killFolk(f,true);
  }
  L.folk=L.folk.filter(f=>!f.dead);
  if(L.folk.length<(WIDE()?10:6)&&++L.folkT>200){L.folkT=0;for(let k=0;k<8;k++){const x=20+Math.random()*(W-40);if(!rectBlocked(x,H-14,10,10)){L.folk.push(mkFolk(x,H-14));break;}}}
}
function spawnDefense(){
  if(--L.spawnT>0)return;
  const S=L.S,el=S.time-L.time,ph=Math.min(2,Math.floor(el/1800));
  L.spawnT=((S.spawn-ph*30)*(WIDE()?1:1.4)+Math.random()*40)*D().spawn;
  const awake=L.enemies.filter(e=>!e.dead).length;
  if(awake>=(WIDE()?14+ph*3:9+ph*2))return;
  let t=wpick(S.mix,Math.random);
  if(ph===0&&t==='rider')t='foot';
  const n=t==='koryo'?3:t==='song'?2+Math.floor(Math.random()*2):1;
  const x0=T+10+Math.random()*(W-2*T-20);
  for(let i=0;i<n;i++){
    /* 画面外(y<0)は壁扱いで動けないので、最上段のマスの内側に出す */
    const x=Math.max(10,Math.min(W-10,x0+(i-(n-1)/2)*14)),y=7+(t==='song'?(i%2)*12:0);
    if(rectBlocked(x,y,10,10))continue;
    const e=mkEnemy(t,x,y,false);e.cd=60+Math.random()*60;L.enemies.push(e);
  }
}
function spawnLogic(){
  const S0=L.S;
  if(S0.kind==='bonus')return;
  if(S0.kind==='defense'){spawnDefense();return;}
  if(--L.spawnT>0)return;
  const S=L.S;
  L.spawnT=(S.spawn*(WIDE()?1:1.5)+Math.random()*50)*(L.flagOn?.7:1)*D().spawn;
  const awake=L.enemies.filter(e=>!e.asleep).length;
  if(awake>=(WIDE()?Math.min(20,9+G.stage*3):Math.min(11,5+G.stage*2)))return;
  const bottom=Math.random()<.3&&L.cam+H+14<L.worldH-24;
  const y=bottom?L.cam+H+10:L.cam-10;
  if(y<20)return;
  for(let k=0;k<8;k++){
    const x=T+Math.random()*(W-2*T);
    if(!rectBlocked(x,y,12,12)){L.enemies.push(mkEnemy(wpick(S.mix,Math.random),x,y,false));return;}
  }
}
function updFx(){
  for(const p of L.parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.life--;}
  L.parts=L.parts.filter(p=>p.life>0);

function stageClear(){

function flagCheck(){

/* ---------- bosses ---------- */
function damageBoss(n){
  const b=L.boss;
  if(!b||b.dead||b.asleep)return;
  b.hp-=n;b.flash=6;sfx.kill();
  burst(b.x,b.y-2,[b.k==='marco'?'#b0252f':'#d8a82a',PAPER],4,1.4);
  if(b.hp<=0)bossDown();
}
function bossDown(){
  const b=L.boss;
  b.dead=true;G.heads++;addScore(b.k==='kublai'?8000:5000);say('おう!',2);
  sfx.boom();sfx.clear();L.shake=24;
  for(let i=0;i<3;i++)L.fx.push({x:b.x+(i-1)*14,y:b.y+(i%2)*8,t:0});
  burst(b.x,b.y,['#d8a82a',PAPER,RED,K],34,3);

  toast('大将の首級をあげた!');

function makeLanes(b){
  const step=22,n=Math.floor((H-40)/step),y0=L.cam+26,rage=b.hp<=b.max/2;
  let si=Math.round((P.y-y0)/step)+Math.floor(Math.random()*5)-2;
  si=Math.max(0,Math.min(n-1,si));
  const base=Math.random()<.5?'r':'l',opp=base==='r'?'l':'r';
  b.lanes=[];
  for(let i=0;i<n;i++)b.lanes.push({y:y0+i*step,dir:(rage&&i%2)?opp:base,safe:i===si});
}
function spawnStamp(b){
  b.lanes.forEach((l,i)=>{
    if(l.safe)return;
    L.stamp.push({x:l.dir==='r'?-24-(i%3)*16:W+24+(i%3)*16,y:l.y,vx:l.dir==='r'?3.2:-3.2});
  });
  sfx.horse();
}
function updStamp(){
  for(const s of L.stamp){
    s.x+=s.vx;
    if(mode==='play'&&P.inv<=0&&Math.abs(s.x-P.x)<14&&Math.abs(s.y-P.y)<11)hurt();
    if(s.x<-70||s.x>W+70)s.dead=true;
  }
  L.stamp=L.stamp.filter(s=>!s.dead);
}
function startBarrage(b){
  const cols=WIDE()?12:6,rowsN=WIDE()?11:5,cw=W/cols,ch=40,y0=L.cam+22;
  const pc=Math.max(0,Math.min(cols-1,Math.floor(P.x/cw))),pr=Math.max(0,Math.min(rowsN-1,Math.floor((P.y-y0)/ch)));
  const safe=new Set();
  safe.add(Math.max(0,Math.min(rowsN-1,pr+Math.floor(Math.random()*3)-1))*cols+Math.max(0,Math.min(cols-1,pc+Math.floor(Math.random()*3)-1)));
  while(safe.size<(WIDE()?16:4))safe.add(Math.floor(Math.random()*cols*rowsN));
  b.safeCells=[];b.sched=[];b.bt=0;
  for(let r=0;r<rowsN;r++)for(let c=0;c<cols;c++){
    const cx=c*cw+cw/2,cy=y0+r*ch+ch/2;
    if(safe.has(r*cols+c))b.safeCells.push({x:c*cw,y:cy-ch/2,w:cw,h:ch});
    else b.sched.push({t:Math.floor(Math.random()*110),x:cx+(Math.random()-.5)*6,y:cy+(Math.random()-.5)*6,done:false});
  }
  L.banner={text:'てつはう 一斉射!',t:100};sfx.throw();
}
function updBoss(){
  const b=L.boss;
  if(!b||b.dead)return;
  if(b.asleep){
    if(b.y>L.cam-20&&b.y<L.cam+H+20){b.asleep=false;toast(b.k==='marco'?'大将 マルコ・ポーロ 登場!':'大汗 フビライ・ハーン 登場!');sfx.power();}
    else return;
  }
  if(b.inv>0)b.inv--;
  if(b.tr>0)b.tr--;
  if(b.flash>0)b.flash--;
  b.anim+=.08;b.f=(b.anim|0)&1;
  const dx=P.x-b.x,dy=P.y-b.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
  const marco=b.k==='marco',rage=b.hp<=b.max/2,vis=b.y>L.cam&&b.y<L.cam+H;
  let mvx=0,mvy=0;const sp=marco?.5:.35;
  b.face=Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u');
  if(b.st===0){
    const want=marco?85:110;
    if(d>want+15){mvx=ux*sp;mvy=uy*sp;}else if(d<want-25){mvx=-ux*sp;mvy=-uy*sp;}
    if(marco&&--b.aim<=0&&vis&&d<230){b.aim=rage?50:75;L.earrows.push({x:b.x,y:b.y,vx:ux*1.6,vy:uy*1.6,life:260,coin:true});sfx.shot2();}
    if(!marco&&--b.sum<=0&&vis){
      b.sum=rage?260:380;
      for(const i of [-1,1]){const e=mkEnemy('foot',b.x+i*24,b.y+8,false);if(!rectBlocked(e.x,e.y,10,10))L.enemies.push(e);}
    }
    if(--b.cd<=0&&vis){
      b.n++;
      const special=marco||(b.n%2===0);
      b.atk=special?(marco?'coins':'group'):'ring';
      b.st=1;b.tt=special?70:36;
      if(special)L.banner={text:marco?'東方見聞録!':'集団戦法!',t:100};
      if(b.atk==='group')makeLanes(b);
    }
  }else if(b.st===1){
    if(--b.tt<=0){
      b.st=2;
      b.tt=b.atk==='coins'?(rage?130:100):b.atk==='group'?110:51;
      if(b.atk==='group')spawnStamp(b);
    }
  }else if(b.st===2){
    b.tt--;
    if(b.atk==='coins'&&b.tt%4===0){
      const arms=rage?4:3;
      for(let i=0;i<arms;i++){const a=b.ang+i*6.283/arms;L.earrows.push({x:b.x,y:b.y,vx:Math.cos(a)*1.15,vy:Math.sin(a)*1.15,life:260,coin:true});}
      b.ang+=.3;
      if(b.tt%8===0)sfx.shot2();
    }
    if(b.atk==='ring'&&(b.tt===49||b.tt===24)){
      const n=14,o=Math.random()*6.283;
      for(let i=0;i<n;i++){const a=o+i*6.283/n;L.earrows.push({x:b.x,y:b.y,vx:Math.cos(a)*1.25,vy:Math.sin(a)*1.25,life:200});}
      sfx.throw();
    }
    if(b.tt<=0){
      if(b.atk==='group'){startBarrage(b);b.st=3;b.tt=170;}
      else{b.st=0;b.cd=(rage?90:140)*D().shot;}
    }
  }else{
    b.bt++;
    for(const q of b.sched){
      if(!q.done&&b.bt>=q.t){q.done=true;L.bombs.push({sx:q.x,sy:q.y-150,tx:q.x,ty:q.y,t:0,dur:55,own:true});}
    }
    if(--b.tt<=0){b.st=0;b.cd=(rage?90:140)*D().shot;b.safeCells=null;b.sched=null;}
  }
  if(mvx||mvy)walk(b,mvx*D().spd,mvy*D().spd,14);
  b.x=Math.max(20,Math.min(W-20,b.x));b.y=Math.max(24,Math.min(H-80,b.y));
  if(mode==='play'&&Math.abs(P.x-b.x)<12&&Math.abs(P.y-b.y)<12){
    if(P.horse&&P.stall<=0){if(b.tr<=0){damageBoss(2);b.tr=40;L.shake=Math.max(L.shake,6);}}
    else if(P.inv<=0)hurt();
  }
}

/* ---------- main update ---------- */
function camera(){L.cam=Math.max(0,Math.min(L.worldH-H,Math.round(P.y-H*.62)));}
function update(){
  tick++;mt++;
  const fe=inp.fire&&!pf;pf=inp.fire;
  if(fe&&(mode==='title'||mode==='over'||mode==='ending'))pressStart();
  if(mode==='title'){
    const l=inp.left&&!ptl,rr=inp.right&&!ptr;ptl=inp.left;ptr=inp.right;
    if(l)setDiff(diff-1);if(rr)setDiff(diff+1);
    return;
  }
  if(mode==='ending'){if(mt===1)sfx.wind();return;}
  if(mode==='over')return;
  if(mode==='intro'){camera();if(mt>110){mode='play';mt=0;}return;}
  if(mode==='play'){
    GALE=L.S.theme==='sea'?gale():{x:0,y:0,s:0,a:0};
    if(P.say&&--P.say.t<=0)P.say=null;
    if(P.homing>0)P.homing--;
    updPlayer();updArrows();updEnemies();updBombs();updEArrows();updItems();updBoss();updStamp();updFx();
    spawnLogic();camera();
    for(const s of L.swings)s.t++;
    L.swings=L.swings.filter(s=>s.t<5);
    if(L.time!==null&&mode==='play'){
      L.time--;
      if(L.S.kind==='defense'){
        const el=L.S.time-L.time;
        if(el===1||el===1800||el===3600){L.wave++;L.banner={text:['第一波','第二波','第三波'][L.wave-1]+' 来襲!',t:100};}
      }
      if(L.time<=0)stageClear();
    }
    if(mode==='play')flagCheck();
    if(L.msgT>0)L.msgT--;
    if(L.banner&&--L.banner.t<=0)L.banner=null;
    if(L.wind>0)L.wind--;
    if(L.shake>0)L.shake--;
    if(L.cryT>0)L.cryT--;
    return;
  }
  if(mode==='dying'){
    updFx();if(L.shake>0)L.shake--;if(L.msgT>0)L.msgT--;
    if(mt>80){
      if(G.lives<=0){saveHi();mode='over';mt=0;}else respawn();
    }
    return;
  }
  if(mode==='clear'){
    updFx();
    if(mt>170){
      if(G.stage<STAGES.length-1){G.stage++;startStage();}
      else{saveHi();mode='ending';mt=0;}
    }
  }
}

    }
    if(sy<-40||sy>H+40)continue;
    if(a===L.boss){drawBoss(a,sy,sea);continue;}
    if(a.isFolk){drawActor('folk',a.x,sy,a.face,a.f);if(a.panic>0&&((tick>>2)&1))text('!',a.x-2,sy-22,8,RED);continue;}
    if(a.t==='rider'){if(sea)drawSeaRam(a.x,sy,a);else drawRider(a.x,sy,a);}
    else{
      if(sea)drawBoat(a.x,sy,true);
      drawActor(a.t,a.x,sy,a.face,a.f,a.sur,a.shield);
      if(sea)boatFront(a.x,sy,true);
    }
  }
  for(const s of L.swings){
    const sy=s.y-L.cam;
    g.save();g.translate(Math.round(s.x),Math.round(sy-2));g.rotate(s.a);g.globalAlpha=.5*(1-s.t/5);
    R(14,-1,10,2,PAPER);g.globalAlpha=1;g.restore();
  }
  for(const s of L.stamp){
    const sy=s.y-L.cam;
    if(sy>-30&&sy<H+30){
      const e={face:s.vx>0?'r':'l',st:2,tt:0,f:(tick>>1)&1};
      if(sea)drawSeaRam(s.x,sy,e);else drawRider(s.x,sy,e);
    }
  }
  for(const a of L.arrows)drawArrow(a,RED);
  for(const a of L.earrows){
    if(a.coin){
      const sy=a.y-L.cam;
      if(sy>-8&&sy<H+8){const cx=Math.round(a.x),cy=Math.round(sy);g.fillStyle=K;g.beginPath();g.arc(cx,cy,3.5,0,6.283);g.fill();g.fillStyle=GOLD;g.beginPath();g.arc(cx,cy,2.5,0,6.283);g.fill();R(cx-1,cy-1,2,2,K);}
    }else drawArrow(a,'#6b7685');
  }
  for(const b of L.bombs){
    const k=b.t/b.dur,x=b.sx+(b.tx-b.sx)*k,y=b.sy+(b.ty-b.sy)*k-Math.sin(Math.PI*k)*30-L.cam;
    R(x-2,b.sy+(b.ty-b.sy)*k-L.cam+3,5,2,'rgba(0,0,0,.3)');
    R(x-2,y-2,5,5,'#111');R(x-1,y-2,1,1,'#aaa');
    if((b.t>>1)&1)R(x+1,y-4,1,2,GOLD);
  }
  for(const f of L.fx){
    const r=6+f.t*.9,a=Math.max(0,1-f.t/28),x=Math.round(f.x),y=Math.round(f.y-L.cam);
    g.globalAlpha=a;g.fillStyle=RED;g.beginPath();g.arc(x,y,r,0,6.283);g.fill();
    g.fillStyle='#f08a2a';g.beginPath();g.arc(x,y,r*.7,0,6.283);g.fill();
    if(f.t<12){g.fillStyle='#fff2c0';g.beginPath();g.arc(x,y,r*.35,0,6.283);g.fill();}
    g.globalAlpha=1;
  }
  for(const p of L.parts)R(p.x,p.y-L.cam,p.s,p.s,p.c);
  if(L.S.theme==='night'){
    const px=Math.round(P.x),py=Math.round(P.y-L.cam),fl=Math.sin(tick/5)*2;
    const gr=g.createRadialGradient(px,py,16,px,py,(WIDE()?104:76)+fl);
    gr.addColorStop(0,'rgba(6,8,22,0)');gr.addColorStop(.55,'rgba(6,8,22,.5)');gr.addColorStop(1,'rgba(6,8,22,.94)');
    g.fillStyle=gr;g.fillRect(0,0,W,H);
    for(const e of L.enemies){
      if(e.dead||e.asleep)continue;
      const sy=e.y-L.cam;if(sy<-20||sy>H+20)continue;
      const fx=Math.round(e.x)+7,fy=Math.round(sy)-14+((tick+e.x|0)&1);
      g.fillStyle=e.alert>0?'rgba(255,90,40,.22)':'rgba(255,170,60,.14)';g.beginPath();g.arc(fx,fy+2,e.alert>0?14:11,0,6.283);g.fill();
      R(fx-1,fy-1,3,3,'#ff9a2a');R(fx,fy-2,1,2,'#fff0a0');R(fx,fy+2,1,7,'#5a3a1e');
    }
    for(const a of L.earrows){const sy=a.y-L.cam;if(sy>-4&&sy<H+4)R(Math.round(a.x),Math.round(sy),2,2,a.coin?GOLD:'#ffe0a0');}
    for(const a of L.arrows)drawArrow(a,RED);
    for(const b of L.bombs){const k=b.t/b.dur,x=b.sx+(b.tx-b.sx)*k,y=b.sy+(b.ty-b.sy)*k-Math.sin(Math.PI*k)*30-L.cam;R(Math.round(x),Math.round(y)-4,2,2,GOLD);}
    for(const it of L.items){
      const sy=it.y-L.cam;if(sy<-20||sy>H+20)continue;
      const pulse=.12+.08*Math.sin(tick/9+it.a);
      g.fillStyle=it.t==='rice'?'rgba(255,220,120,'+pulse+')':'rgba(220,235,255,'+pulse+')';
      g.beginPath();g.arc(Math.round(it.x),Math.round(sy),16,0,6.283);g.fill();
      drawItem(it);
    }
  }
  if(L.S.theme==='sea'){
    g.fillStyle='rgba(20,24,64,.22)';g.fillRect(0,0,W,H);
    for(let i=0;i<110;i++)R((i*53+tick*2)%W,(i*37+tick*8)%H,1,4,'rgba(200,220,255,.3)');
  }
  if(L.wind>0){
    const k=L.wind/100;
    g.fillStyle='rgba(46,140,138,'+(.35*k)+')';g.fillRect(0,0,W,H);
    g.strokeStyle='rgba(239,228,204,'+(.8*k)+')';g.lineWidth=2;
    for(let i=0;i<6;i++){g.beginPath();const a0=tick*.25+i*1.047;g.arc(W/2,H/2,20+(100-L.wind)*3.6+i*6,a0,a0+1.6);g.stroke();}
  }
  if(sea&&GALE.s>.1){
    const gx=Math.cos(GALE.a),gy=Math.sin(GALE.a),len=5+12*GALE.s;
    g.strokeStyle='rgba(235,245,255,'+(.18+.3*GALE.s)+')';g.lineWidth=1;
    for(let i=0;i<50;i++){
      const sp=3*GALE.s*(1+(i%3)*.4);
      const x=(((i*53+tick*gx*sp)%W)+W)%W,y=(((i*37+tick*gy*sp)%H)+H)%H;
      g.beginPath();g.moveTo(Math.round(x),Math.round(y));g.lineTo(Math.round(x-gx*len),Math.round(y-gy*len));g.stroke();
    }
  }
  for(const e of L.enemies){
    if(e.dead||e.asleep||e.sayT<=0)continue;
    const sy=e.y-L.cam;if(sy<-20||sy>H+20)continue;
    const tx='ここじゃー',w=[...tx].length*8+8,h=12;
    const bx=Math.max(2,Math.min(W-w-2,Math.round(e.x-w/2))),by=Math.max(24,Math.round(sy-28));
    R(bx,by,w,h,K);R(bx+1,by+1,w-2,h-2,'#ffd9c0');
    text(tx,bx+w/2,by+2,8,K,'center');
    R(Math.round(e.x)-1,by+h,3,2,K);
  }
  if(P.say&&P.say.t>0&&mode!=='dying'){
    const sy=P.y-L.cam,w=[...P.say.text].length*8+8,h=12;
    const bx=Math.max(2,Math.min(W-w-2,Math.round(P.x-w/2))),by=Math.max(24,Math.round(sy-(P.horse?44:26)));
    R(bx,by,w,h,K);R(bx+1,by+1,w-2,h-2,PAPER);
    text(P.say.text,bx+w/2,by+2,8,K,'center');
    R(Math.round(P.x)-1,by+h,3,2,K);R(Math.round(P.x),by+h+2,1,1,K);
  }
  g.restore();
  drawHud();
}
function drawHud(){
  R(0,0,W,12,'rgba(20,17,15,.8)');
  const def=L.S.kind==='defense',bon=L.S.kind==='bonus';
  /* 一段目: 御家人(兜の印)・米/守り・首級・残り時間、右端にライフの♥ */
  text('御家人',4,2,8,PAPER);
  const nl=Math.min(G.lives,5);
  for(let i=0;i<nl;i++){const x=30+i*8;R(x,3,6,6,K);R(x+1,4,4,2,GOLD);R(x+1,6,4,2,'#2f4a9a');R(x,3,1,2,GOLD);R(x+5,3,1,2,GOLD);}
  if(G.lives>5)text('+'+(G.lives-5),30+nl*8,2,8,PAPER);
  if(def){
    text('守り',72,2,8,PAPER);
    for(let i=0;i<D().guard;i++){R(90+i*7,3,6,6,K);if(i<L.guard)R(91+i*7,4,4,4,i<2&&L.guard<=2&&((tick>>3)&1)?RED:GOLD);}
  }else{
    text('米',72,2,8,PAPER);
    text(L.rice+'/'+L.need,82,2,8,L.rice>=L.need?GOLD:PAPER);
  }
  text('首級',124,2,8,PAPER);
  text(String(G.heads),142,2,8,GOLD);
  if(L.time!==null){const sec=Math.ceil(L.time/60);text('残'+sec,170,2,8,sec<=10&&((tick>>3)&1)?RED:PAPER);}
  else if(L.flagOn&&!bon&&((tick>>4)&1))text(L.boss&&!L.boss.dead?'大将!':'本陣↑',170,2,8,GOLD);
  const mx=D().life;
  for(let i=0;i<mx;i++){
    const x=W-4-(mx-i)*9,y=2,on=i<P.hp,c=on?((P.hp===1&&((tick>>3)&1))?'#ff8080':RED):'#4a3a3a';
    R(x,y+1,3,2,c);R(x+4,y+1,3,2,c);R(x,y+3,7,2,c);R(x+1,y+5,5,1,c);R(x+2,y+6,3,1,c);R(x+3,y+7,1,1,c);
    if(on)R(x+1,y+2,1,1,'#ffb0b0');
  }
  /* 二段目: 装備と風、右端に得点 */
  const seaH=L.S.theme==='sea',st=true;
  R(0,12,W,10,'rgba(20,17,15,.55)');
  {
    let hx=4;
    if(P.horse){text('馬',hx,13,8,P.stall>0&&((tick>>3)&1)?RED:GOLD);hx+=12;}
    if(G.naginata){text(P.weapon==='bow'?'弓':'薙刀',hx,13,8,GOLD);hx+=P.weapon==='bow'?12:20;}
    if(seaH){text('漕ぎ手×'+P.rowers,hx,13,8,P.rowers?GOLD:PAPER);hx+=48;}
    if(P.bowLv>0){text('矢×'+P.bowLv*3,hx,13,8,GOLD);hx+=32;}
    if(P.homing>0){text('追尾',hx,13,8,P.homing<180&&((tick>>3)&1)?RED:GOLD);hx+=20;}
    if(seaH){
      const lv=GALE.s<.35?'弱':GALE.s<.7?'中':'強';
      text('風'+lv,hx,13,8,PAPER);
      const cx=hx+24,cy=17,gx=Math.cos(GALE.a),gy=Math.sin(GALE.a),ln=2+4*GALE.s,ax=cx+gx*ln,ay=cy+gy*ln;
      g.strokeStyle=PAPER;g.lineWidth=1.5;g.beginPath();g.moveTo(cx-gx*ln,cy-gy*ln);g.lineTo(ax,ay);
      g.moveTo(ax,ay);g.lineTo(ax-gx*3-gy*2,ay-gy*3+gx*2);g.moveTo(ax,ay);g.lineTo(ax-gx*3+gy*2,ay-gy*3-gx*2);g.stroke();
    }
    text(String(G.score).padStart(6,'0'),W-4,13,8,PAPER,'right');
  }
  const bb=L.boss;
  if(bb&&!bb.asleep&&!bb.dead){
    text(bb.k==='marco'?'マルコ・ポーロ':'フビライ・ハーン',8,H-22,8,PAPER);
    R(8,H-12,W-16,7,K);R(9,H-11,Math.max(0,Math.round((W-18)*bb.hp/bb.max)),5,RED);
  }
  if(L.banner&&mode==='play'){
    const bt=L.banner.text,on=(L.banner.t>>2)&1;
    g.fillStyle='rgba(20,17,15,.7)';g.fillRect(0,H/2-70,W,22);
    otext(bt,W/2,H/2-67,16,on?GOLD:PAPER,'#7a1a10','center');
  }
  if(L.msgT>0&&mode==='play'){
    const w=Math.min(W-16,L.msg.length*8+16),ty=st?26:22;
    g.fillStyle='rgba(20,17,15,.85)';g.fillRect(W/2-w/2,ty,w,14);
    text(L.msg,W/2,ty+3,8,PAPER,'center');
  }
}
function banner(){
  const oy=(H-240)/2;
  if(mode==='intro'){
    g.fillStyle='rgba(20,17,15,.72)';g.fillRect(0,oy+70,W,100);
    otext('第'+KAN[G.stage]+'面'+(L.S.kind==='bonus'?' ボーナス':''),W/2,oy+78,16,GOLD,K,'center');
    otext(L.S.name,W/2,oy+100,16,PAPER,K,'center');
    const sub=L.S.kind==='bonus'?'米俵 '+L.need+'俵 すべて拾えば御家人が増える':L.S.kind==='defense'?'九十秒 守りぬけ 守りがゼロで討死':'米俵を '+L.need+'俵 集めて、本陣の旗へ';
    text(sub,W/2,oy+132,8,PAPER,'center');
    if(L.S.tip)text(L.S.tip,W/2,oy+146,8,GOLD,'center');
  }else if(mode==='clear'){
    g.fillStyle='rgba(20,17,15,.62)';g.fillRect(0,oy+80,W,80);
    const kd=L.S.kind;
    otext(kd==='defense'?'博多を守りぬいた':kd==='bonus'?'米俵 '+L.rice+'/'+L.need:'本陣を守りぬいた',W/2,oy+92,16,GOLD,K,'center');
    text(kd==='defense'?'ボーナス +1000  守り×300':kd==='bonus'?(L.bonusLife?'すべて集めた! 御家人が増えた':'ボーナス +1000'):'面クリア  ボーナス +1000',W/2,oy+122,8,PAPER,'center');
    text('首級 '+G.heads,W/2,oy+136,8,GOLD,'center');
  }else if(mode==='over'){
    g.fillStyle='rgba(20,17,15,.78)';g.fillRect(0,0,W,H);
    otext('討死',W/2,oy+70,32,RED,K,'center');
    text('首級 '+G.heads,W/2,oy+112,8,PAPER,'center');
    text('SCORE '+String(G.score).padStart(6,'0'),W/2,oy+130,8,PAPER,'center');
    text('HI    '+String(hi).padStart(6,'0'),W/2,oy+144,8,GOLD,'center');
    if(mt>45&&((mt>>5)&1))text('Enter / クリックでもう一度',W/2,oy+176,8,PAPER,'center');
  }
}
function draw(){
  g.setTransform(2,0,0,2,0,0);
  g.imageSmoothingEnabled=false;
  g.clearRect(0,0,W,H);
  const sc=W/SW*2;
  if(mode==='title'){g.setTransform(sc,0,0,sc,0,0);drawTitle();g.setTransform(2,0,0,2,0,0);}
  else if(mode==='ending'){g.setTransform(sc,0,0,sc,0,0);drawEnding();g.setTransform(2,0,0,2,0,0);}
  else if(L){drawWorld();banner();}
  if(paused){
    g.fillStyle='rgba(20,17,15,.82)';g.fillRect(0,0,W,H);
    g.save();g.translate((W-256)/2,(H-240)/2);
    otext('一時停止',128,20,16,PAPER,K,'center');
    text('操作説明',128,48,8,GOLD,'center');
    const rows=[
      ['移動','矢印キー / WASD'],
      ['攻撃','Z / Space(押しっぱなし可)'],
      ['','弓は矢を放つ 薙刀は撫で斬り'],
      ['持ち替え','X / Shift(薙刀を得てから)'],
      ['再開','P / Esc'],['音量','M (5段階)']
    ];
    rows.forEach((rw,i)=>{text(rw[0],24,64+i*12,8,GOLD);text(rw[1],80,64+i*12,8,PAPER);});
    text('いまの装備',128,144,8,GOLD,'center');
    const eq=[];
    if(P){
      eq.push(G.naginata?(P.weapon==='bow'?'弓(薙刀あり)':'薙刀(弓あり)'):'弓');
      if(P.bowLv>0)eq.push('三矢 '+P.bowLv*3+'本');
      if(P.horse)eq.push('馬');
      if(L&&L.S.theme==='sea')eq.push('漕ぎ手 '+P.rowers+'人');
    }
    text(eq.join('  '),128,158,8,PAPER,'center');
    if(L&&L.S.kind==='defense')text('敵を下へ通すな 町民を斬るな',128,178,8,PAPER,'center');
    else if(L&&L.S.kind==='bonus')text('時間内に米俵を拾えるだけ拾え',128,178,8,PAPER,'center');
    else text('米俵を集めて 本陣の旗へ',128,178,8,PAPER,'center');
    text('P で再開',128,204,8,GOLD,'center');
    g.restore();
  }
}

/* ---------- legend sprites ---------- */
function drawMini(c){
  const t=c.dataset.spr;
  g=c.getContext('2d');
  g.setTransform(2,0,0,2,0,0);
  if(t==='rider')drawRider(15,22,{face:'r',f:0,st:0,tt:0});
  else if(t==='marco')drawBossSprite('marco',16,19,'d',0,false,1);
  else if(t==='kublai')drawBossSprite('kublai',16,23,'d',0,false,.75);
  else drawActor(t,16,20,'d',0,t==='song'&&false,t==='koryo'?20:0);
  g=main;
}
document.querySelectorAll('[data-spr]').forEach(drawMini);

/* ---------- loop ---------- */
if(document.fonts&&document.fonts.load){
  document.fonts.load("16px 'DotGothic16'").catch(()=>{});
}
let last=performance.now(),acc=0;
const STEP=1000/60;
function frame(t){
  acc+=Math.min(100,t-last);last=t;
  while(acc>=STEP){if(!paused)update();acc-=STEP;}
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
